<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>h4rl's jukebox!</title>
		<link href="/styles/styles.css" rel="stylesheet">
		<link rel="icon" href="/assets/imissyou.webp" type="image/webp">
		<script src="/src/index.ts"></script>
	</head>
	<body class="bg-mantle text-text font-arimo">
		<!-- Left -->
		<div class="hidden fixed -z-1 landscape:xl:left-0 landscape:xl:block">
			<img
				id="left-banner"
				src="/assets/eichi-yuu-patchouli-remilia.webp"
				alt="eichi yuu's art of Patchouli Knowledge and Remilia Scarlet"
				class="h-screen brightness-0 grayscale-100 contrast-100 -z-1"
			>
		</div>
		<!--Right -->
		<div class="hidden fixed -z-1 landscape:xl:right-0 landscape:xl:block">
			<img
				id="right-banner"
				src="/assets/eichi-yuu-reimu-marisa-sanae.webp"
				alt="eichi yuu's art of Reimu Hakurei, Marisa Kirisame, and Sanae Kochiya"
				class="h-screen brightness-0 grayscale-100 contrast-100 -z-1"
			>
		</div>

		<header class="py-5">
			<a
				href="https://safebooru.org/index.php?page=post&s=view&id=1092998"
				target="_blank"
				class="absolute top-0 right-2"
			>
				source
			</a>
			<a
				href="https://safebooru.org/index.php?page=post&s=view&id=1092934"
				target="_blank"
				class="absolute top-0 left-2"
			>
				source
			</a>
			<div class="flex flex-row gap-3 justify-center items-center">
				<img
					class="p-1 rounded-full border-2 border-dashed transition-all duration-100 ease-in-out animate-reverse-spin border-accent w-22 h-22"
					src="/assets/imissyou.webp"
					alt="imissyou"
					id="imissyou"
				>
				<h1 class="text-2xl font-arimo-bold">h4rl's jukebox!</h1>
			</div>
			<small class="block my-4 text-center">Where bad vibes go to die~</small>
		</header>

		<main
			class="flex flex-col gap-4 items-center py-5 pb-10 mx-auto rounded-2xl border-2 border-solid max-w-200 bg-base border-text"
		>
			<section class="flex flex-col justify-center items-center w-9/10">
				<!-- Theme Menu -->
				<ul
					id="theme-dropdown-menu"
					class="absolute top-60 w-64 rounded-xl bg-base fade-element"
				>
					<li>
						<button
							type="button"
							class="py-2 w-full rounded-tl-xl rounded-tr-xl border-t-2 border-b-2 border-solid transition-colors duration-300 ease-in-out cursor-pointer latte text-accent bg-base border-crust hover:bg-crust"
							id="catppuccin-latte"
						>
							Catppuccin Latte
						</button>
					</li>
					<li>
						<button
							type="button"
							class="py-2 w-full border-r-2 border-l-2 border-solid transition-colors duration-300 ease-in-out cursor-pointer frappe text-accent bg-base border-mantle hover:bg-mantle"
							id="catppuccin-frappe"
						>
							Catppuccin Frappe
						</button>
					</li>
					<li>
						<button
							type="button"
							class="py-2 w-full border-r-2 border-l-2 border-solid transition-colors duration-300 ease-in-out cursor-pointer macchiato text-accent bg-base border-mantle hover:bg-mantle"
							id="catppuccin-macchiato"
						>
							Catppuccin Macchiato
						</button>
					</li>
					<li>
						<button
							type="button"
							class="py-2 w-full rounded-br-xl rounded-bl-xl border-r-2 border-b-2 border-l-2 border-solid transition-colors duration-300 ease-in-out cursor-pointer mocha text-accent bg-base border-mantle hover:bg-mantle"
							id="catppuccin-mocha"
						>
							Catppuccin Mocha
						</button>
					</li>
				</ul>

				<!-- Theme button -->
				<button
					id="theme-dropdown"
					class="py-1 px-2 w-64 rounded-2xl transition-all duration-300 ease-in-out cursor-pointer bg-accent hover:brightness-75"
					type="button"
					aria-haspopup="true"
					aria-expanded="false"
				></button>
				<small class="mb-4">Choose ur theme c:</small>

				<div id="iframe-container" class="w-full"></div>
			</section>
			<section class="w-9/10">
				<iframe
					src="https://h4rl.atabook.org/"
					frameborder="0"
					style="width: 100%; height: 700px;"
					class="rounded-2xl border-2 border-solid border-accent"
				></iframe>
			</section>
		</main>
		<footer><small class="block my-4 text-center">Take care!</small></footer>
	</body>
</html>
